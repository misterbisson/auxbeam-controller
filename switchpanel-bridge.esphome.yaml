# --- State feedback from the panel (FFF2 notify) -----------------------------
# The panel pushes channel state here. Payload = one nibble per channel
# (odd = ON, mode = nibble/2). VERIFY on hardware whether a leading count byte
# is present. This text_sensor logs raw notifications so you can confirm the
# framing, then fan the nibbles out to the switches (publish_state) in the lambda.
text_sensor:
  - platform: ble_client
    ble_client_id: panel
    name: "Panel raw state (FFF2)"
    service_uuid:        "fff0"
    characteristic_uuid: "fff2"
    notify: true
    lambda: |-
      std::string hex;
      char buf[4];
      for (auto b : x) { sprintf(buf, "%02X", b); hex += buf; }
      ESP_LOGI("panel", "FFF2 notify: %s", hex.c_str());
      // TODO once framing confirmed: for ch=1..12 read nibble, id(chNN).publish_state(nibble & 1);
      return hex;

# --- RGB backlight (FFF4) -----------------------------------------------------
# Whole-panel backlight (one color for all legends). Wire frame = [brightness,R,G,B].
# HA exposes a normal RGB light. ESPHome scales R/G/B by the HA brightness slider,
# so we pin the panel's master-brightness byte to 0xFF and let the scaled RGB carry
# brightness. (Prefer the panel's native brightness byte instead? Send it as byte[0]
# and disable ESPHome's scaling with `gamma_correct: 0` + a brightness-only mode.)
# The three template outputs fire near-simultaneously on a color change; the
# `mode: restart` script debounces them into ONE 4-byte packet.

globals:
  - { id: g_r, type: int, restore_value: false, initial_value: '0' }
  - { id: g_g, type: int, restore_value: false, initial_value: '0' }
  - { id: g_b, type: int, restore_value: false, initial_value: '0' }

output:
  - platform: template
    id: bl_r
    type: float
    write_action:
      - lambda: id(g_r) = (int)(state * 255.0f);
      - script.execute: bl_flush
  - platform: template
    id: bl_g
    type: float
    write_action:
      - lambda: id(g_g) = (int)(state * 255.0f);
      - script.execute: bl_flush
  - platform: template
    id: bl_b
    type: float
    write_action:
      - lambda: id(g_b) = (int)(state * 255.0f);
      - script.execute: bl_flush

light:
  - platform: rgb
    name: "Panel Backlight"
    id: backlight
    red: bl_r
    green: bl_g
    blue: bl_b

script:
  - id: bl_flush
    mode: restart          # collapse the 3 output writes into a single packet
    then:
      - delay: 30ms
      - ble_client.ble_write:
          id: panel
          service_uuid:        "fff0"
          characteristic_uuid: "fff4"
          value: !lambda |-
            return { 0xFF, (uint8_t) id(g_r), (uint8_t) id(g_g), (uint8_t) id(g_b) };

# --- Pulse timing (FFFA) ------------------------------------------------------
# One panel-wide byte for pulsed-mode ("Flash") channels. NOTE the inversion:
# the app slider is 0..46 but the WIRE byte = 50 - slider, so the real range is
# 4..50 (lower byte = longer travel on the app slider). We expose the raw byte
# directly to HA. Units unconfirmed (likely tens of ms) — label once measured.
number:
  - platform: template
    name: "Panel Pulse Time"
    id: pulse_time
    optimistic: true
    min_value: 4
    max_value: 50
    step: 1
    mode: slider
    set_action:
      - ble_client.ble_write:
          id: panel
          service_uuid:        "fff0"
          characteristic_uuid: "fffa"
          value: !lambda 'return { (uint8_t) x };'   # x = selected number (4..50)

